<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zona no encontrada · Kevin del Río</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Geist:wght@400;600&family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root { --texto: #f4f7fd; --suave: #cad6e5; --oro: #e0b756; --oro-2: #f3d27f; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; align-items: center;
      color: var(--texto); font: 16px/1.6 "Geist", system-ui, sans-serif;
      background: #06122a url("/assets/img/fondo/lejano-2.jpg") center / cover no-repeat;
    }
    /* el acantilado con los personajes, a la derecha, igual que en el inicio */
    body::before { content: ""; position: fixed; inset: 0; background: url("/assets/img/fondo/frente.webp") right bottom / auto 100% no-repeat; pointer-events: none; }
    body::after { content: ""; position: fixed; inset: 0; background: linear-gradient(90deg, rgba(3, 11, 26, .85), rgba(3, 11, 26, .45) 55%, rgba(3, 11, 26, .1)); pointer-events: none; }
    main { position: relative; z-index: 1; width: min(1180px, 100% - 32px); margin-inline: auto; }
    .codigo { margin: 0; font: .8rem/1.6 "Press Start 2P", monospace; color: var(--oro); }
    h1 { margin: 10px 0 12px; font: 700 clamp(2.2rem, 6vw, 3.8rem)/1.05 "Cinzel", Georgia, serif; text-wrap: balance; }
    p { max-width: 46ch; margin: 0 0 26px; color: var(--suave); font-size: 1.08rem; }
    a {
      display: inline-flex; padding: .72em 1.25em; border-radius: 999px; text-decoration: none;
      font-weight: 600; color: #1b1405; background: linear-gradient(180deg, var(--oro-2), var(--oro));
      box-shadow: 0 8px 22px rgba(224, 183, 86, .28); transition: transform .15s ease-out;
    }
    a:hover { transform: translateY(-2px); }
    a:active { transform: scale(.97); }
    a:focus-visible { outline: 2px solid var(--oro-2); outline-offset: 3px; }
    @media (max-width: 820px) { body::before { opacity: .45; } }
  </style>
</head>
<body>
  <main>
    <p class="codigo">Error 404</p>
    <h1>Esta zona no está en el mapa</h1>
    <p>La página que buscas no existe o cambió de lugar. El reino completo sigue donde lo dejaste.</p>
    <a href="/">Volver al reino</a>
  </main>
</body>
</html>
